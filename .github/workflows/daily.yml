name: daily-digest

on:
  schedule:
    - cron: "45 23 * * *"   # UTC 23:45 = 北京时间 07:45（兜底，主链路是本机 07:05）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build digest
        run: python build_feed.py

      - name: Commit docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
